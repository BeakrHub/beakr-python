[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beakr-sdk"
version = "0.1.0"
description = "Python SDK for the Beakr public API"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Beakr", email = "hello@thebeakr.com" }]
keywords = ["beakr", "wiki", "knowledge-graph", "sdk", "api"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "keyring>=25",
    "typing-extensions>=4.7",
]

[project.urls]
Homepage = "https://thebeakr.com"
Repository = "https://github.com/BeakrHub/beakr-python"
Issues = "https://github.com/BeakrHub/beakr-python/issues"
Changelog = "https://github.com/BeakrHub/beakr-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/beakr_sdk"]

[tool.hatch.build.targets.sdist]
include = ["/src/beakr_sdk", "/README.md", "/CHANGELOG.md", "/LICENSE"]

[tool.ruff]
target-version = "py310"
line-length = 100
# Verbatim copies of other repositories' files (scripts/refresh_snapshots.py).
extend-exclude = ["snapshots"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Generated from the public contract and the private full contract
# (scripts/generate_python_sdk.py): long type expressions are left whole, and the
# freshness test requires the exact output.
"src/beakr_sdk/_generated/*" = ["E501"]

[tool.ruff.format]
exclude = ["src/beakr_sdk/_generated/*"]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
# The hand-written resources are conveniences: they take plain ``str`` and
# ``dict`` arguments (a role, a status, a body assembled from optional fields)
# and pass them to the generated builders, whose parameters carry the contract's
# exact ``Literal`` and ``TypedDict`` types. Narrowing every convenience
# signature to those types would change the public method signatures; the
# server validates the values either way. Only these two codes are relaxed, and
# only here: the generated layer (``beakr.api``) and every other check stay strict.
module = ["beakr_sdk.resources.*"]
disable_error_code = ["arg-type", "typeddict-item"]

[[tool.mypy.overrides]]
# keyring is imported lazily, only when the OS keychain is used.
module = ["keyring.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
